<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Status</title>
<link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="card.css">
</head><body>
<div class="st-row">
<div class="st" style="background:var(--warn-tint);color:var(--warn-ink)"><i class="icon-triangle-alert"></i><div><b>Warn</b><span>Unclear handwriting, past sweet spot</span></div></div>
<div class="st" style="background:var(--ok-tint);color:var(--ok-ink)"><i class="icon-circle-check"></i><div><b>OK</b><span>Confirmed, synced</span></div></div>
<div class="st" style="background:var(--danger-tint);color:var(--danger-ink)"><i class="icon-circle-alert"></i><div><b>Danger</b><span>Rash, discard, sign out</span></div></div></div>
</body></html>
