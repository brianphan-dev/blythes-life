<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blythe's Life — app icon export sheet</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px;background:var(--paper-200);color:var(--paper-900);font:var(--type-callout)}
a{color:var(--honey-700)}a:hover{color:var(--honey-800)}
.row{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.frame{width:1024px;height:1024px;line-height:0}
.frame canvas{display:block;width:1024px;height:1024px}
#icon-foreground{background:repeating-conic-gradient(var(--paper-300) 0 25%,var(--paper-0) 0 50%) 0 0/32px 32px}
</style>
</head>
<body>
<p id="status">Drawing…</p>
<div class="row"><span class="bl-label">Light · 1024 × 1024</span><div class="frame" id="icon-light"><canvas width="1024" height="1024"></canvas></div></div>
<div class="row"><span class="bl-label">Dark · 1024 × 1024</span><div class="frame" id="icon-dark"><canvas width="1024" height="1024"></canvas></div></div>
<div class="row"><span class="bl-label">Tinted · 1024 × 1024</span><div class="frame" id="icon-tinted"><canvas width="1024" height="1024"></canvas></div></div>
<div class="row"><span class="bl-label">Foreground layer · transparent</span><div class="frame" id="icon-foreground"><canvas width="1024" height="1024"></canvas></div></div>
<script>
// Option 2a (Bottle) in colourway 3d (Lavender). Geometry matches brand/App Icon Options.html:
// [x, y, width, height, corner radii] in tenths of the icon width.
(function () {
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  const U = 102.4;
  const BOTTLE = [[4.55, 1.5, .9, 1.3, [.45]], [3.75, 2.3, 2.5, 1.25, [1.25, 1.25, 0, 0]], [3.05, 3.55, 3.9, .8, [.25]], [3.2, 4.57, 3.6, 4.03, [.5, .5, 1.1, 1.1]]];
  const MARKS = [[4.9, 5.35, 1.4, .28, [.14]], [5.4, 6.25, .9, .28, [.14]], [4.9, 7.15, 1.4, .28, [.14]]];
  function fill(x, list, color) {
    x.fillStyle = color;
    list.forEach(s => { x.beginPath(); x.roundRect(s[0] * U, s[1] * U, s[2] * U, s[3] * U, s[4].map(r => r * U)); x.fill(); });
  }
  function draw(id, bg, fg, hi) {
    const x = document.querySelector('#' + id + ' canvas').getContext('2d');
    x.clearRect(0, 0, 1024, 1024);
    if (bg) { x.fillStyle = bg; x.fillRect(0, 0, 1024, 1024); }
    fill(x, BOTTLE, fg);
    fill(x, MARKS, hi);
  }
  draw('icon-light', tok('--sleep-100'), tok('--sleep-700'), tok('--honey-300'));
  draw('icon-dark', '#000', tok('--sleep-300'), '#000');
  draw('icon-tinted', '#000', '#e6e6e6', '#000');
  draw('icon-foreground', null, tok('--sleep-700'), tok('--honey-300'));
  document.getElementById('status').textContent = 'Ready.';
})();
</script>
</body>
</html>
