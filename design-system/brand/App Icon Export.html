<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Blythe's Life — app icon export sheet</title>
<link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px;background:var(--paper-200);color:var(--paper-900);font:var(--type-callout)}
a{color:var(--honey-700)}a:hover{color:var(--honey-800)}
.row{display:flex;flex-direction:column;gap:8px;margin-bottom:24px}
.frame{width:1024px;height:1024px;line-height:0}
.frame canvas{display:block;width:1024px;height:1024px}
#icon-foreground{background:repeating-conic-gradient(var(--paper-300) 0 25%,var(--paper-0) 0 50%) 0 0/32px 32px}
#m{position:absolute;left:0;top:0;visibility:hidden;width:1024px;height:1024px;font-size:102.4px;display:flex;align-items:center;justify-content:center}
#mb{display:block;padding:0 .12em;font:500 6.6em/.86 var(--font-display);border-bottom:.022em solid}
#mz{display:inline-block;width:0;height:0}
</style>
</head>
<body>
<p id="status">Drawing…</p>
<div class="row"><span class="bl-label">Light · 1024 × 1024</span><div class="frame" id="icon-light"><canvas width="1024" height="1024"></canvas></div></div>
<div class="row"><span class="bl-label">Dark · 1024 × 1024</span><div class="frame" id="icon-dark"><canvas width="1024" height="1024"></canvas></div></div>
<div class="row"><span class="bl-label">Tinted · 1024 × 1024</span><div class="frame" id="icon-tinted"><canvas width="1024" height="1024"></canvas></div></div>
<div class="row"><span class="bl-label">Foreground layer · transparent</span><div class="frame" id="icon-foreground"><canvas width="1024" height="1024"></canvas></div></div>
<div id="m"><b id="mb"><span id="mt">B</span><span id="mz"></span></b></div>
<script>
// Geometry is measured from the same CSS that draws option 1a, then painted to canvas at 1024px.
(async function () {
  const css = getComputedStyle(document.documentElement);
  const tok = n => css.getPropertyValue(n).trim();
  await document.fonts.load('500 676px Newsreader', 'B');
  await document.fonts.ready;
  const ok = document.fonts.check('500 676px Newsreader', 'B');
  const r = document.getElementById('m').getBoundingClientRect();
  const mb = document.getElementById('mb'), bb = mb.getBoundingClientRect();
  const cs = getComputedStyle(mb), bw = parseFloat(cs.borderBottomWidth);
  const g = {
    fs: parseFloat(cs.fontSize),
    tx: document.getElementById('mt').getBoundingClientRect().left - r.left,
    base: document.getElementById('mz').getBoundingClientRect().bottom - r.top,
    rx: bb.left - r.left, ry: bb.bottom - r.top - bw, rw: bb.width, rh: bw,
  };
  function draw(id, bg, fg) {
    const x = document.querySelector('#' + id + ' canvas').getContext('2d');
    x.clearRect(0, 0, 1024, 1024);
    if (bg) { x.fillStyle = bg; x.fillRect(0, 0, 1024, 1024); }
    x.fillStyle = fg;
    x.font = '500 ' + g.fs + 'px Newsreader, Georgia, serif';
    x.textBaseline = 'alphabetic';
    x.fillText('B', g.tx, g.base);
    x.fillRect(g.rx, g.ry, g.rw, g.rh);
  }
  draw('icon-light', tok('--honey-400'), tok('--paper-900'));
  draw('icon-dark', '#000', tok('--honey-400'));
  draw('icon-tinted', '#000', '#e6e6e6');
  draw('icon-foreground', null, tok('--paper-900'));
  document.getElementById('status').textContent = ok ? 'Ready. Newsreader loaded.' : 'Newsreader did not load. Do not export.';
})();
</script>
</body>
</html>
