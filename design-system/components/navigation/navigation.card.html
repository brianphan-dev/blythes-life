<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Navigation & overlays</title>
<link rel="stylesheet" href="../../styles.css"><link rel="stylesheet" href="../card.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head><body><div id="root"></div>
<script type="text/babel">
const NS = window.BlytheSLifeDesignSystem_420b07;
const { TabBar, Sheet, Toast, Button, SegmentedControl, EventIcon } = NS;
function Demo() {
  const [tab, setTab] = React.useState('today');
  const [pee, setPee] = React.useState('M');
  const [open, setOpen] = React.useState(true);
  return (
    <div className="g2">
      <div className="stage">
        <div style={{ padding: 16 }}><Button variant="secondary" onClick={() => setOpen(true)}>Open sheet</Button></div>
        <Sheet open={open} onClose={() => setOpen(false)} title="Diaper" icon={<EventIcon type="diaper" />} footer={<Button size="lg" block onClick={() => setOpen(false)}>Log diaper</Button>}>
          <div className="col"><span className="bl-label">Pee</span><SegmentedControl block size="lg" options={['None', 'S', 'M', 'L']} value={pee} onChange={setPee} /></div>
        </Sheet>
      </div>
      <div className="stage">
        <Toast open message="Bottle logged · 3.25 oz" actionLabel="Undo" style={{ bottom: 72 }} />
        <TabBar value={tab} onChange={setTab} items={[
          { id: 'today', label: 'Today', icon: 'sun' },
          { id: 'rhythm', label: 'Rhythm', icon: 'calendar-range' },
          { id: 'sheets', label: 'Sheets', icon: 'scan-text', badge: 1 },
          { id: 'settings', label: 'Settings', icon: 'settings' },
        ]} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script></body></html>
